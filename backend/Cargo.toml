[package]
name = "eco-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
encoding_rs = "0.8.35"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset"] }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
